name: debug (temporary)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch league data
        env:
          SLEEPER_USERNAME: PatrickSerio
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_LEAGUE_IDS: "610033022,43688494"
          ESPN_KEEPER_OVERRIDES: '{}'
        run: python fetch/build_data.py
      - name: Inspect live-stat wiring
        run: python fetch/debug_live1.py
